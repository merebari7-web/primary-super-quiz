  <style>
    #boot{position:fixed;inset:0;z-index:300;display:grid;place-items:center;align-content:center;gap:12px;text-align:center;background:#f7efe0;color:#0a5a56;font-family:Nunito,"Segoe UI",sans-serif;padding:32px 20px}
    #boot img{width:112px;height:112px;border-radius:28px;object-fit:cover;box-shadow:0 18px 40px rgba(14,124,118,.22)}
    #boot .boot-title{margin:0;font-family:Fredoka,"Trebuchet MS",sans-serif;font-size:28px;font-weight:700}
    #boot .boot-sub{margin:0;font-weight:700;color:#5b6b7a;font-size:16px}
    #boot .spinner{width:42px;height:42px;border:4px solid #eadcc6;border-top-color:#0e7c76;border-radius:50%;animation:psq-spin .7s linear infinite}
    #boot.out{opacity:0;pointer-events:none;transition:opacity .4s ease}
    @keyframes psq-spin{to{transform:rotate(360deg)}}
    @media (prefers-color-scheme:dark){
      #boot{background:#121820;color:#3ecfc6}
      #boot .boot-sub{color:#9aabbb}
      #boot .spinner{border-color:#2c3a4a;border-top-color:#3ecfc6}
    }
    @media (prefers-reduced-motion:reduce){#boot .spinner{animation:none}#boot.out{transition:none}}
  </style>
